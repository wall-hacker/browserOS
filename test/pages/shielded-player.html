<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shielded player</title>
<!-- A player like flystream.net's: a click shield over the <video>, controls that hide when
     idle and come back on mousemove over the player, fullscreen on the player container. -->
<style>
  body { margin: 0; background: #111; color: #eee; font: 16px sans-serif; }
  #player { position: relative; width: 960px; height: 540px; margin: 40px; background: #000; }
  #player video { width: 100%; height: 100%; display: block; }
  #player:-webkit-full-screen { width: 100%; height: 100%; margin: 0; }
  #player:fullscreen { width: 100%; height: 100%; margin: 0; }
  .shield { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px; display: flex; background: rgba(0, 0, 0, .6); }
  .bar button { margin-right: 10px; padding: 8px 14px; }
  #player.idle .bar { opacity: 0; visibility: hidden; }
</style>
</head>
<body>
<div id="player">
  <video src="/media/movie.wav" preload="auto"></video>
  <div class="shield"></div>
  <div class="bar">
    <button id="play" type="button">Play</button>
    <button id="fs" type="button">Fullscreen</button>
  </div>
</div>
<a id="below" href="#below">Below the player</a>
<script>
  var player = document.getElementById('player');
  var video = player.querySelector('video');
  var idle;
  function wake() {
    player.classList.remove('idle');
    clearTimeout(idle);
    idle = setTimeout(function () { player.classList.add('idle'); }, 2000);
  }
  player.addEventListener('mousemove', wake);
  wake();
  document.getElementById('play').addEventListener('click', function () { video.paused ? video.play() : video.pause(); });
  document.getElementById('fs').addEventListener('click', function () {
    var req = player.requestFullscreen || player.webkitRequestFullscreen;
    req.call(player);
  });
</script>
</body>
</html>
